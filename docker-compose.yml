services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokedox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokedox}
      POSTGRES_DB: ${POSTGRES_DB:-pokedox}
    volumes:
      - pokedox_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokedox}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-pokedox}:${POSTGRES_PASSWORD:-pokedox}@db:5432/${POSTGRES_DB:-pokedox}
      API_USERNAME: ${API_USERNAME:-kauan}
      API_PASSWORD: ${API_PASSWORD:-admin}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pokedox_db_data:
